name: Build and Publish ATS Annotation Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build app exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_installer.ps1

      - name: Read app version
        id: version
        shell: powershell
        run: |
          $content = Get-Content app.py -Raw
          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $baseVersion = $Matches[1]
          } else {
            throw "APP_VERSION not found in app.py"
          }
          $releaseVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
          "base_version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=v$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ATS Annotation Tool ${{ steps.version.outputs.release_version }}
          body: |
            Automated build from commit ${{ github.sha }}.
          files: |
            installer_output/ATS_Annotation_Tool_Setup.exe
          make_latest: true
          prerelease: false
