name: Build and Publish ATS Annotation Tool

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Determine next version
        id: version
        shell: powershell
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "ATS Annotation Tool"
          }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ariastechsolutions/annotation-app/releases/latest" -Headers $headers -Method Get
            $tag = [string]$release.tag_name
          } catch {
            $tag = ""
          }
          $numbers = [regex]::Matches($tag, '\d+') | ForEach-Object { [int]$_.Value }
          if ($numbers.Count -ge 3) {
            $major = $numbers[0]
            $minor = $numbers[1]
            $patch = $numbers[2] + 1
          } else {
            $major = 1
            $minor = 0
            $patch = 1
          }
          $releaseVersion = "$major.$minor.$patch"
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=v$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Apply version to build files
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.release_version }}"
          (Get-Content app.py -Raw) `
            -replace 'APP_VERSION\s*=\s*"[0-9.]+"', "APP_VERSION = `"$version`"" `
            | Set-Content app.py
          (Get-Content installer.iss -Raw) `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" `
            | Set-Content installer.iss

      - name: Build app exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_installer.ps1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ATS Annotation Tool ${{ steps.version.outputs.release_version }}
          body: |
            Automated build from commit ${{ github.sha }}.
          files: |
            installer_output/ATS_Annotation_Tool_Setup.exe
          make_latest: true
          prerelease: false
